services:
  - type: web
    name: margin-document-qa
    runtime: docker
    rootDir: document-qa
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studywise-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        fromService:
          name: studywise
          type: web
          envVarKey: OPENROUTER_API_KEY
      - key: OPENROUTER_CHAT_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "512"
      - key: MIN_RELEVANCE_SCORE
        value: "0.28"
