services:
  - type: web
    name: studywise
    runtime: docker
    rootDir: studywise
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studywise-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash-lite

databases:
  - name: studywise-db
    databaseName: study_assistant
    user: studywise
    postgresMajorVersion: "16"
    plan: free
